# Publish the container image to GHCR on push to main + version tags (Layer 2:
# recovery + deploy become pull-not-build, NEX-626). Deps are public; no auth.
name: release-image
on:
  push: { branches: [main], tags: ['v*'] }
permissions: { contents: read, packages: write }
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/carriedworlduniverse/interchange-gateway
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/interchange-gateway/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
