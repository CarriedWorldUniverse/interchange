apiVersion: apps/v1
kind: Deployment
metadata:
  name: interchange-gateway
  namespace: cwb
  labels:
    app: interchange-gateway
spec:
  # ≥2 replicas removes the single-pod SPOF (NEX-428). interchange is
  # stateless (verifies the herald JWT locally against JWKS, injects the
  # X-CWB-* / cwb-* identity) so it scales horizontally with no coordination.
  # On single-node dMon both replicas land on the one node — this protects
  # against pod crash + rolling updates, NOT node failure (replicas can't on
  # one node). Rollout surges a new pod up before any old pod goes down so
  # the gateway is never fully unavailable.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: interchange-gateway
  template:
    metadata:
      labels:
        app: interchange-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/carriedworlduniverse/interchange-gateway:sha-272e387@sha256:f68a77e4f224ec79c7bc40d4b677082c023b7e910d45de70c890ee5a7ff337f1
          imagePullPolicy: IfNotPresent
          # Bounded so a traffic burst (e.g. CI git fan-out proxied through
          # here) can't starve node neighbours (NEX-428). interchange is a
          # streaming proxy + local JWT verify — light CPU, low memory (it
          # does NOT buffer git pack bodies). Requests are modest; limits
          # leave headroom for throughput bursts. No WriteTimeout is set on
          # the server precisely so long git clones aren't cut off.
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: INTERCHANGE_ADDR
              value: ":8080"
            - name: INTERCHANGE_ROUTES
              # /knowledge and /ledger are NOT here — both are gRPC edges below.
              # /cairn is a COMPOSITE edge: its /api/ lane is gRPC (see
              # INTERCHANGE_CAIRN_GRPC) and its .git lane reverse-proxies to this
              # cairn HTTP backend, which the gateway reads from this route then
              # removes from the plain reverse-proxy set.
              value: "/herald=http://herald.cwb.svc:8099,/cairn=http://cairn.cwb.svc:8100"
            - name: INTERCHANGE_HERALD_ISSUER
              # Must match HERALD_ISSUER exactly — this is what the `iss`
              # claim is checked against.
              value: "http://dmonextreme.tail41686e.ts.net:8080/herald/"
            - name: INTERCHANGE_HERALD_JWKS_URL
              # Internal JWKS path — the gateway can't fetch discovery via
              # itself before it's listening, so go direct to herald.
              value: "http://herald.cwb.svc:8099/jwks"
            - name: INTERCHANGE_PUBLIC_PATHS
              # Discovery + JWKS + token-exchange must be reachable without a
              # bearer token: discovery/JWKS so consumers can fetch keys
              # before minting; /token because it IS the credential exchange
              # (verifies its own assertion, not a bearer).
              value: "/herald/.well-known/,/herald/jwks,/herald/token"
            # gRPC edge — /knowledge requests are translated to gRPC calls
            # against commonplace using the interchange-client-tls mTLS cert.
            - name: INTERCHANGE_COMMONPLACE_GRPC
              value: "commonplace.cwb.svc:8101"
            # gRPC edge — ledger is no longer reverse-proxied; interchange dials
            # it directly over mTLS using the interchange-client-tls cert.
            - name: INTERCHANGE_LEDGER_GRPC
              value: "ledger.cwb.svc:8081"
            # gRPC edge — cairn's /api/ lane (Phase 3). The .git lane uses the
            # /cairn reverse-proxy backend in INTERCHANGE_ROUTES above.
            - name: INTERCHANGE_CAIRN_GRPC
              value: "cairn.cwb.svc:8102"
            # gRPC edge — herald's admin /api/ lane (Phase 4). The OIDC lane
            # (.well-known/jwks/token) reverse-proxies to the /herald backend in
            # INTERCHANGE_ROUTES above (HTTP passthrough).
            - name: INTERCHANGE_HERALD_GRPC
              value: "herald.cwb.svc:8098"
            # gRPC edge — almanac (Config/Secret/AlmanacAdmin services). Core
            # pillar: no product gate; config:*/secret:* scopes enforced in
            # almanac itself (NEX-621 leg 1).
            - name: INTERCHANGE_ALMANAC_GRPC
              value: "almanac.cwb.svc.cluster.local:8083"
            # gRPC edge — mason (AppService: read/trigger of almanac-declared
            # apps). Core pillar: no product gate; app:* scopes enforced in
            # mason itself (NEX-621 leg 1).
            - name: INTERCHANGE_MASON_GRPC
              value: "mason.cwb.svc.cluster.local:8086"
            # gRPC edge — atlas (StrataService: read-only cloud state behind
            # the Strata live map, B12). Platform infra: no product gate;
            # read-scope enforcement lives in atlas itself.
            - name: INTERCHANGE_ATLAS_GRPC
              value: "atlas.cwb.svc.cluster.local:8089"
            # mTLS client cert for gRPC calls to commonplace.
            # cert-manager populates interchange-client-tls from 05-certs.yaml
            # in the commonplace repo.
            - name: INTERCHANGE_TLS_CERT
              value: "/etc/cwb/tls/tls.crt"
            - name: INTERCHANGE_TLS_KEY
              value: "/etc/cwb/tls/tls.key"
            - name: INTERCHANGE_TLS_CA
              value: "/etc/cwb/tls/ca.crt"
          volumeMounts:
            - name: tls
              mountPath: /etc/cwb/tls
              readOnly: true
          # Interchange itself stays plain HTTP on :8080 — probes unchanged.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: tls
          secret:
            secretName: interchange-client-tls
