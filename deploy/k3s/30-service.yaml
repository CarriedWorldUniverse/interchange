apiVersion: v1
kind: Service
metadata:
  name: interchange-gateway
  namespace: cwb
  labels:
    app: interchange-gateway
spec:
  type: LoadBalancer
  # Pinned so atlas/croft can hostAlias dmonextreme.tail41686e.ts.net → this
  # IP without the alias silently breaking on a Service recreation.
  clusterIP: 10.43.239.151
  selector:
    app: interchange-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
